[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-bench"
version = "0.1.0"
description = "机器学习基准与真实数据分析：sklearn 基准 / 空气质量分析 / 检索方法对照"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "heee-a" }]
keywords = ["benchmark", "machine-learning", "air-quality", "bm25", "lsa"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "jieba>=0.42",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["datap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
